- id: pat-12-error-handling
  title: Gestione degli errori - eccezioni, Result e confini
  category: patterns
  track: knowledge
  level: medium
  tags: [errori, eccezioni, api, struttura]
  estimated_minutes: 30
  summary: >-
    Come modellare i fallimenti è una decisione architetturale. La distinzione utile è fra
    errori attesi, che fanno parte del dominio, ed errori inattesi, che sono bug o guasti:
    i due meritano trattamenti diversi.
  deep_dive: |-
    La distinzione che organizza tutto è fra errori *attesi* e *inattesi*. Un errore
    atteso è un esito previsto del dominio - saldo insufficiente, email già registrata,
    ordine non annullabile - e fa parte del contratto dell'operazione: chi la chiama deve
    sapere che può succedere. Un errore inatteso è un guasto o un bug - database
    irraggiungibile, riferimento nullo, disco pieno: non si gestisce localmente, si lascia
    salire, si osserva e si corregge.

    Il primo tipo va modellato *esplicitamente*, con eccezioni di dominio proprie:
    `SaldoInsufficiente(conto_id, richiesto, disponibile)` comunica molto più di un
    `ValueError("errore")`, e permette a chi chiama di distinguere i casi senza leggere
    stringhe. Il secondo tipo non va catturato: un `except Exception: pass` trasforma un
    guasto in un comportamento sbagliato silenzioso, che è la cosa peggiore che possa
    capitare a un sistema, perché nessuno se ne accorge.

    La traduzione in HTTP va fatta in *un punto solo*, tipicamente un exception handler
    del framework che mappa ogni eccezione di dominio sul suo status code. Se la mappatura
    è sparsa nei controller, la stessa eccezione finirà tradotta in modi diversi in
    endpoint diversi, e nessuno saprà più qual è il contratto. Questo punto unico è anche
    il posto giusto per costruire il corpo in formato Problem Details e per decidere cosa
    esporre: il messaggio per l'utente e il dettaglio per il log sono due cose diverse, e
    stacktrace, query e nomi di tabelle non devono mai finire in una risposta.

    L'alternativa alle eccezioni è il tipo *Result*: la funzione restituisce "successo con
    valore" oppure "errore con motivo", e il chiamante è obbligato dal tipo a gestire
    entrambi i casi. È idiomatico in Rust e in Go (dove l'errore è un valore di ritorno) e
    ha un vantaggio reale: i fallimenti attesi compaiono nella *firma*, quindi non
    sfuggono. Lo svantaggio in linguaggi come Python o Java è che va controcorrente
    rispetto alle librerie, e finisce per produrre conversioni continue fra i due stili.
    La soluzione pratica: Result dove i fallimenti attesi sono molti e vanno composti
    (validazioni, parsing, pipeline), eccezioni per tutto il resto.

    Due regole finali che valgono in qualunque stile. *Fail fast*: un errore non
    gestibile deve fallire subito e rumorosamente, con abbastanza contesto da diagnosticarlo
    (identificatori, non solo il messaggio); un errore ingoiato è un bug che si manifesta
    dieci minuti dopo, altrove. E *non usare le eccezioni per il controllo di flusso
    normale*: se una condizione capita nel 50% dei casi, non è un'eccezione, è un esito,
    e va modellata come tale.
  key_points:
    - "Errore atteso (saldo insufficiente, email già registrata): è un esito di business, va modellato esplicitamente"
    - "Errore inatteso (database irraggiungibile, riferimento nullo): non si gestisce localmente, si lascia salire e si osserva"
    - "Eccezioni di dominio proprie, con contesto nei campi: SaldoInsufficiente(conto, richiesto, disponibile)"
    - "Il dominio solleva eccezioni di dominio; è il livello HTTP a tradurle in status code, in un punto solo"
    - "L'alternativa è il tipo Result, esplicito nella firma. Idiomatico in Rust e Go, meno in Python e Java"
    - "Mai except generico che ingoia tutto: nasconde i bug e trasforma un guasto in un comportamento sbagliato silenzioso"
    - "Un errore non gestibile deve fallire in fretta e rumorosamente, con abbastanza contesto per la diagnosi"
    - "Il messaggio per l'utente e il dettaglio per il log sono due cose diverse: mai esporre stacktrace o query nel body"
    - "Non usare le eccezioni per il controllo di flusso normale: se capita spesso, è un esito, non un'eccezione"
    - "Il punto unico di traduzione è anche dove si costruisce il corpo standard (Problem Details, RFC 9457)"
  examples:
    - title: Eccezioni di dominio e un solo punto di traduzione
      language: python
      code: |-
        # dominio/errori.py - nessun riferimento a HTTP
        class ErroreDominio(Exception):
            """Base di tutti gli esiti attesi."""

        class SaldoInsufficiente(ErroreDominio):
            def __init__(self, conto_id: str, richiesto: int, disponibile: int):
                super().__init__(f"saldo insufficiente su {conto_id}")
                self.conto_id, self.richiesto, self.disponibile = conto_id, richiesto, disponibile

        # web/errori.py - UNICO punto in cui il dominio incontra HTTP
        MAPPA: dict[type[ErroreDominio], int] = {
            SaldoInsufficiente: 422,
            EmailGiaRegistrata: 409,
            RisorsaInesistente: 404,
            OperazioneNonPermessa: 403,
        }

        @app.exception_handler(ErroreDominio)
        async def gestisci(request: Request, exc: ErroreDominio) -> JSONResponse:
            stato = MAPPA.get(type(exc), 400)
            logger.warning("errore_dominio", tipo=type(exc).__name__, dettaglio=str(exc))
            return JSONResponse(status_code=stato, media_type="application/problem+json",
                content={"type": f"https://api.esempio.it/errors/{type(exc).__name__}",
                         "title": messaggio_utente(exc), "status": stato})
      note: >-
        Il dominio non importa nulla da `fastapi`, e la mappa sta in un file solo: cambiare
        uno status code è una riga, non una caccia in venti controller.
    - title: Quando il Result conviene davvero
      language: python
      code: |-
        # Molti fallimenti attesi da comporre: con le eccezioni si perde il primo errore
        # o si scrive un try per ogni passo.
        @dataclass(frozen=True)
        class Ok[T]:  valore: T
        @dataclass(frozen=True)
        class Errore: motivo: str; campo: str

        Result = Ok[T] | Errore

        def valida(dati: dict) -> Result[Richiesta]:
            errori = [e for e in (valida_email(dati), valida_date(dati), valida_importo(dati))
                      if isinstance(e, Errore)]
            if errori:
                return errori[0]          # oppure li si accumula tutti per la risposta
            return Ok(Richiesta(**dati))

        # Il chiamante è costretto dal tipo a considerare entrambi i casi.
        match valida(corpo):
            case Ok(richiesta): ...
            case Errore(motivo, campo): ...
      note: >-
        Il vantaggio è che i fallimenti attesi stanno nella firma. Lo svantaggio è che
        tutto ciò che sta sotto (librerie, driver) continua a sollevare eccezioni.
  trade_offs:
    - option: Eccezioni di dominio
      pros: Idiomatiche in Python/Java, non inquinano le firme, propagazione automatica
      cons: Invisibili nella firma, facile dimenticarne una
      when: Default in linguaggi a eccezioni, per esiti attesi ma poco frequenti
    - option: Tipo Result
      pros: I fallimenti compaiono nel tipo, impossibile ignorarli, ottimo da comporre
      cons: Va controcorrente rispetto alle librerie, conversioni continue
      when: Validazioni e pipeline con molti fallimenti attesi
    - option: Codici di ritorno
      pros: Nessun costo, esplicito
      cons: Facilmente ignorati, nessun contesto
      when: Interfacce di sistema, linguaggi senza eccezioni
  numbers:
    - "RFC 9457 (Problem Details) dà un formato standard per il corpo: type, title, status, detail, instance"
    - "Regola pratica: se un 'errore' capita in più del 10-20% delle chiamate, è un esito da modellare, non un'eccezione"
  interview_answer: >-
    Distinguo fra errori attesi e inattesi. Il saldo insufficiente è un esito previsto del
    dominio, quindi lo modello con un'eccezione di dominio esplicita che porta anche il
    contesto - conto, importo richiesto, disponibile - e lo tratto come parte del contratto
    dell'operazione. Un timeout sul database invece è un guasto: non lo gestisco nel caso
    d'uso, lo lascio salire e mi assicuro che arrivi al monitoraggio. La traduzione da
    eccezioni a status code HTTP la faccio in un punto solo, tipicamente un exception
    handler del framework, così i service non sanno nulla di HTTP e il contratto degli
    errori è definito in un file invece che sparso. Nel corpo uso il formato Problem
    Details e tengo separati il messaggio per l'utente e il dettaglio per il log, perché
    stacktrace e query non devono mai uscire. Il Result lo uso dove i fallimenti attesi
    sono molti e vanno composti, tipicamente nelle validazioni.
  senior_signals:
    - "Organizza il discorso su atteso/inatteso invece che su try/except"
    - "Centralizza la traduzione e sa dire perché"
    - "Mette contesto strutturato nelle eccezioni invece che solo un messaggio"
    - "Conosce il tipo Result e ne dichiara i limiti nel proprio linguaggio"
  pitfalls:
    - "except Exception: pass, che nasconde guasti reali"
    - "Mappare eccezioni a status code in ogni controller invece che in un handler centrale"
    - "Esporre messaggi interni o stacktrace nella risposta"
    - "Usare le eccezioni per il controllo di flusso normale"
    - "Eccezioni senza contesto: 'operazione non valida' non aiuta nessuno a capire cosa sia successo"
  follow_ups:
    - question: Come traduci un'eccezione di dominio in una risposta HTTP senza che il service conosca HTTP?
      answer: >-
        Con un gestore centralizzato al livello web: il dominio solleva le proprie
        eccezioni, il framework le intercetta e una mappa le associa agli status code. Il
        dominio non importa nulla dal framework e la mappa è l'unico punto in cui il
        contratto degli errori è definito. Nello stesso posto costruisco il corpo in
        formato Problem Details, così tutti gli errori hanno la stessa forma.
    - question: Quando preferiresti un tipo Result a un'eccezione?
      answer: >-
        Quando i fallimenti attesi sono tanti, frequenti e vanno composti: validazione di
        un modulo, parsing, pipeline di trasformazioni. Lì il Result rende i casi di
        errore visibili nella firma e permette di accumularli invece di fermarsi al
        primo. Per gli esiti rari e eccezionali resto sulle eccezioni, perché in Python o
        Java il Result costringe a convertire continuamente fra i due mondi e il codice
        peggiora.
    - question: Un errore va loggato dove viene sollevato o dove viene gestito?
      answer: >-
        Dove viene gestito, una volta sola, con tutto il contesto raccolto lungo il
        percorso. Loggare a ogni livello produce la stessa eccezione ripetuta cinque
        volte, con il rumore che ne consegue e la difficoltà di capire quale sia
        l'occorrenza vera. Se un livello intermedio ha informazioni utili, le aggiunge
        all'eccezione (contesto, identificatori) invece di scrivere una riga di log e
        rilanciare.
  related: [core-04-http-status-codes, pat-03-service-layer, rel-38-observability, pat-09-gof-patterns]
  resources:
    - title: "RFC 9457 - Problem Details for HTTP APIs"
      url: "https://www.rfc-editor.org/rfc/rfc9457.html"
      kind: doc
