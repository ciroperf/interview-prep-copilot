  interview_answer: >-
    Scelgo in base a cosa voglio fare del messaggio dopo. Se è un lavoro da svolgere una
    volta sola e poi dimenticare, una task queue come RabbitMQ o SQS è la scelta naturale.
    Se è un evento che più consumatori diversi devono poter leggere, magari anche rileggere
    in futuro per ricostruire uno stato, allora Kafka, perché il log resta e ogni consumer
    ha il suo offset. Il dettaglio su cui si sbaglia più spesso è l'ordine: in Kafka è
    garantito solo all'interno di una partizione, quindi se mi serve l'ordine per utente
    devo usare l'user id come chiave di partizionamento, altrimenti gli eventi dello stesso
    utente finiscono su partizioni diverse e l'ordine si perde. E do per scontato
    l'at-least-once: rendo il consumatore idempotente e committo l'offset solo dopo aver
    committato l'effetto sul database.
