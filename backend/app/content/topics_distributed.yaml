  follow_ups:
    - question: Come garantisci l'ordine degli eventi per un singolo utente in Kafka?
      answer: >-
        Usando l'id utente come chiave del messaggio: la chiave determina la partizione e
        l'ordine è garantito dentro la partizione. Va poi evitato di rielaborare in
        parallelo i messaggi della stessa partizione dentro il consumer, altrimenti
        l'ordine si perde a valle. Se una chiave diventa troppo calda si può passare a
        una chiave composita, accettando di perdere l'ordine globale per quell'utente e
        mantenendolo solo per sotto-flussi.
    - question: Cosa metti in una dead letter queue e come la gestisci?
      answer: >-
        I messaggi che hanno fallito più volte per una ragione non transitoria: formato
        invalido, riferimento a un'entità che non esiste, bug. Vanno conservati con il
        motivo dell'errore e il numero di tentativi, e serve una procedura per
        esaminarli, correggerli e rimetterli in circolo (redrive). Una DLQ che cresce
        senza che nessuno la guardi è solo un modo elegante di perdere dati: va
        monitorata come una coda vera.
    - question: Kafka promette exactly-once. Ci credi?
      answer: >-
        Ci credo per ciò che promette davvero: con produttore idempotente e transazioni,
        la sequenza leggi-elabora-scrivi *dentro Kafka* è atomica, offset compreso. Non
        vale verso l'esterno: se il consumatore scrive su Postgres o chiama un'API,
        l'atomicità fra quel sistema e l'offset non esiste. Quindi la mia risposta
        pratica resta: consumatore idempotente, registro dei messaggi visti nella stessa
        transazione dell'effetto, offset committato dopo.
