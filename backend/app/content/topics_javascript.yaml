# KB dedicata a JavaScript e TypeScript. Fa parte del percorso "javascript".
#
# Taglio: i meccanismi che i colloqui chiedono davvero - coercizione, closure, this,
# prototipi, event loop, tipi - con gli esempi che compaiono nei quiz e le trappole
# che si incontrano in produzione.

- id: js-01-tipi-coercizione
  title: Tipi primitivi e coercizione
  category: languages
  track: knowledge
  level: medium
  tags: [javascript, tipi, coercizione, fondamentali]
  estimated_minutes: 25
  summary: >-
    JavaScript ha sette primitivi e un solo tipo numerico a virgola mobile; la
    coercizione implicita converte i valori quando gli operatori non combaciano, ed è la
    sorgente della maggior parte dei quiz da colloquio e di parecchi bug reali.
  deep_dive: |-
    I primitivi sono `string`, `number`, `boolean`, `null`, `undefined`, `symbol`,
    `bigint`; tutto il resto è oggetto, funzioni e array compresi. I primitivi sono
    immutabili e confrontati per valore; gli oggetti per riferimento, il che spiega
    perché `{a: 1} === {a: 1}` è falso.

    La distinzione `null`/`undefined` va saputa: `undefined` significa "non assegnato" ed
    è ciò che ottieni da una variabile dichiarata e non inizializzata, da un parametro
    mancante o da una proprietà inesistente; `null` è un valore *assegnato
    deliberatamente* per dire "nessun valore". Da qui un dettaglio da colloquio: i
    valori di default dei parametri scattano su `undefined` ma non su `null`.

    Su `==` e `===`: il primo applica le regole di conversione di ECMAScript, il secondo
    no. La pratica corretta è usare sempre `===`, con un'eccezione idiomatica accettata:
    `x == null` è un modo compatto e corretto di dire "è `null` oppure `undefined`". Il
    resto - `[] == false` vero, `null == 0` falso ma `null >= 0` vero - non va imparato
    a memoria: va evitato.

    Sui numeri: esiste un solo tipo, IEEE 754 a doppia precisione, quindi `0.1 + 0.2 !==
    0.3` come in quasi tutti i linguaggi, e gli interi sono esatti solo fino a
    `Number.MAX_SAFE_INTEGER` (2^53 - 1). Le conseguenze pratiche sono due e vanno dette
    a un colloquio: gli importi monetari si trattano in centesimi interi (o con una
    libreria decimale), e gli id numerici a 64 bit provenienti da un backend vanno
    trasportati come *stringhe*, altrimenti si corrompono silenziosamente in JSON. Per i
    numeri davvero grandi c'è `BigInt`, che però non si mescola con `number` nelle
    operazioni.

    Altri due comportamenti che compaiono di continuo: `NaN !== NaN`, quindi per
    verificarlo si usa `Number.isNaN` (non il vecchio `isNaN`, che converte prima); e
    `typeof null === "object"`, un bug storico mai corretto per retrocompatibilità. Per
    distinguere davvero i tipi: `Array.isArray`, `instanceof` per le classi,
    `Object.prototype.toString.call(x)` per i casi limite.

    Infine il capitolo *copie*: lo spread `{...oggetto}` e `Object.assign` sono
    superficiali, quindi gli oggetti annidati restano condivisi. Per una copia profonda
    oggi esiste `structuredClone`, standard e molto più corretto del vecchio
    `JSON.parse(JSON.stringify(x))`, che perde `Date`, `Map`, `Set`, `undefined` e
    va in errore sui riferimenti circolari.
  key_points:
    - "Sette primitivi (string, number, boolean, null, undefined, symbol, bigint); tutto il resto è oggetto"
    - "Primitivi confrontati per valore, oggetti per riferimento: {a:1} === {a:1} è falso"
    - "undefined = non assegnato, null = assenza deliberata. I default dei parametri scattano su undefined, non su null"
    - "Usa sempre ===. L'unica eccezione idiomatica è `x == null`, che copre null e undefined insieme"
    - "Un solo tipo numerico (IEEE 754): 0.1 + 0.2 !== 0.3 e gli interi sono esatti fino a 2^53 - 1"
    - "Conseguenze pratiche: soldi in centesimi interi, id a 64 bit trasportati come stringhe"
    - "NaN !== NaN: si verifica con Number.isNaN, non con il vecchio isNaN che converte prima"
    - "typeof null === 'object' è un bug storico; per i tipi veri usa Array.isArray, instanceof, Object.prototype.toString.call"
    - "Spread e Object.assign sono copie superficiali; structuredClone fa la copia profonda correttamente"
    - "JSON.parse(JSON.stringify(x)) perde Date, Map, Set e undefined e fallisce sui cicli"
  examples:
    - title: I quiz classici, e la regola che li rende inutili
      language: javascript
      code: |-
        0.1 + 0.2 === 0.3        // false  -> confronta con una tolleranza, o usa interi
        NaN === NaN              // false  -> Number.isNaN(x)
        typeof null              // "object"  (bug storico)
        [] == false              // true   -> coercizione: [] -> "" -> 0 -> false
        null == undefined        // true
        null === undefined       // false
        9007199254740993         // 9007199254740992: oltre MAX_SAFE_INTEGER si perde

        // La regola pratica: usa ===, e i quiz smettono di essere rilevanti.
        // L'unica eccezione idiomatica:
        if (valore == null) { /* è null oppure undefined */ }
      note: >-
        A un colloquio la risposta forte non è recitare la tabella di conversione: è
        dire perché non si usa `==` e quali sono le due o tre conseguenze pratiche
        (soldi, id grandi, confronti fra float).
    - title: Copie superficiali e profonde
      language: javascript
      code: |-
        const utente = { nome: "Mario", indirizzo: { citta: "Napoli" }, nato: new Date() };

        const copia = { ...utente };                 // SUPERFICIALE
        copia.indirizzo.citta = "Roma";
        utente.indirizzo.citta;                      // "Roma": stesso oggetto annidato

        const json = JSON.parse(JSON.stringify(utente));   // perde il tipo Date
        typeof json.nato;                            // "string"

        const vera = structuredClone(utente);        // profonda, mantiene Date/Map/Set
        vera.nato instanceof Date;                   // true
      note: >-
        `structuredClone` è disponibile nei browser moderni e in Node 17+: è la risposta
        giusta alla domanda "come copio in profondità?", senza librerie.
  trade_offs:
    - option: number per gli importi
      pros: Semplice, nessuna conversione
      cons: Errori di arrotondamento accumulati, inaccettabile sui soldi
      when: Mai su valori monetari
    - option: Interi in centesimi
      pros: Esatto fino a cifre enormi, nessuna dipendenza
      cons: Conversione nella presentazione, attenzione alle divisioni
      when: Il default per il denaro
    - option: BigInt
      pros: Interi arbitrariamente grandi ed esatti
      cons: Non si mescola con number, non serializzabile in JSON direttamente
      when: Id a 64 bit, crittografia, contatori enormi
    - option: Libreria decimale (decimal.js)
      pros: Aritmetica decimale corretta, arrotondamenti configurabili
      cons: Dipendenza e overhead
      when: Calcoli finanziari con percentuali e divisioni
  numbers:
    - "Number.MAX_SAFE_INTEGER = 2^53 - 1 = 9.007.199.254.740.991"
    - "Un id a 64 bit (Snowflake, bigint di Postgres) NON entra in un number: va trasportato come stringa"
    - "0.1 + 0.2 = 0.30000000000000004: la differenza è ~5.5e-17, ma basta a far fallire un ==="
  interview_answer: >-
    JavaScript ha sette primitivi e un solo tipo numerico a virgola mobile, e la
    coercizione implicita converte i valori quando gli operatori non combaciano. La mia
    regola è usare sempre il confronto stretto, con l'unica eccezione idiomatica di `x ==
    null` per coprire null e undefined insieme: così le domande trabocchetto sulla tabella
    di conversione diventano irrilevanti. I due punti che portano problemi veri in
    produzione sono numerici: gli importi non vanno tenuti in floating point, quindi lavoro
    in centesimi interi, e gli id a 64 bit che arrivano dal backend vanno trasportati come
    stringhe, perché oltre 2^53 il numero si corrompe in silenzio quando fai il parse del
    JSON. Sulle copie ricordo che lo spread è superficiale e che oggi per la copia profonda
    c'è structuredClone, che a differenza del giro con JSON mantiene Date, Map e Set.
  senior_signals:
    - "Evita la coercizione invece di conoscerne la tabella a memoria"
    - "Porta il problema degli id a 64 bit, che è un bug reale e silenzioso"
    - "Conosce structuredClone e i limiti del giro con JSON"
    - "Distingue null e undefined anche nel comportamento dei default"
  pitfalls:
    - "Usare == e affidarsi alla coercizione"
    - "Tenere importi monetari in floating point"
    - "Fare JSON.parse di id numerici a 64 bit: si corrompono oltre 2^53"
    - "Copiare con spread pensando che sia profondo"
    - "isNaN al posto di Number.isNaN: isNaN('abc') è true perché converte prima"
  follow_ups:
    - question: Perché 0.1 + 0.2 non fa 0.3, e cosa fai in pratica?
      answer: >-
        Perché i number sono IEEE 754 in base due e 0,1 e 0,2 non hanno rappresentazione
        finita: la somma dà 0.30000000000000004. Non è una stranezza di JavaScript, vale
        in quasi tutti i linguaggi. In pratica: per i soldi lavoro in centesimi interi e
        converto solo nella presentazione; per confronti fra float uso una tolleranza
        (`Math.abs(a - b) < Number.EPSILON * fattore`); per calcoli finanziari complessi
        una libreria decimale.
    - question: Come copi un oggetto annidato senza sorprese?
      answer: >-
        Con `structuredClone`, che è standard, gestisce Date, Map, Set, TypedArray e
        anche i riferimenti circolari. Lo spread e `Object.assign` copiano solo il primo
        livello, quindi gli oggetti annidati restano condivisi e modificarne uno modifica
        entrambi. Il vecchio `JSON.parse(JSON.stringify(x))` funziona solo su dati
        JSON-puri: perde i tipi e fallisce sui cicli. Non clona funzioni e nodi DOM:
        in quei casi la copia profonda non ha senso e va ripensato il modello.
    - question: Quando useresti BigInt?
      answer: >-
        Quando i valori superano 2^53 e devono restare esatti: identificatori a 64 bit,
        contatori molto grandi, calcoli crittografici. Con due avvertenze pratiche: non
        si può mescolare con `number` nelle operazioni senza conversione esplicita, e
        `JSON.stringify` non lo serializza, quindi al confine va comunque trasformato in
        stringa. Per i soli id, spesso la scelta più semplice resta trattarli come
        stringhe opache.
  related: [js-02-scope-closure-this, js-07-typescript, core-01-what-is-an-api]
  resources:
    - title: "MDN - JavaScript data types and data structures"
      url: "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Data_structures"
      kind: doc
    - title: "javascript.info - Tipi e conversioni"
      url: "https://javascript.info/types"
      kind: article
    - title: "lydiahallie/javascript-questions - quiz con spiegazione"
      url: "https://github.com/lydiahallie/javascript-questions"
