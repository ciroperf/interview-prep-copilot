- id: core-10-idempotency
  title: Idempotenza (specialmente nei pagamenti)
  category: core-concepts
  track: knowledge
  level: medium
  tags: [api, affidabilita, pagamenti]
  estimated_minutes: 30
  summary: >-
    Un'operazione è idempotente se eseguirla più volte lascia il sistema nello stesso
    stato di averla eseguita una volta sola. Serve perché la rete non dà mai certezze: un
    timeout non dice se l'operazione è andata a buon fine o no.
  deep_dive: |-
    Il problema da cui tutto nasce è l'incertezza del timeout. Il client manda un
    pagamento, scade il timeout, e a quel punto ha tre ipotesi indistinguibili: la
    richiesta non è mai arrivata, è arrivata ed è stata eseguita ma la risposta si è
    persa, oppure è ancora in esecuzione. Senza idempotenza ogni retry è una scommessa
    fra perdere l'ordine e addebitare due volte.

    La soluzione standard è la idempotency key: un identificatore generato dal client,
    uno per *tentativo logico* (non uno per retry!), inviato nell'header
    `Idempotency-Key`. Il server lo registra insieme al risultato della prima
    esecuzione; se la stessa chiave ritorna, non riesegue: restituisce la risposta
    memorizzata. È il modo in cui funzionano Stripe, Adyen e PayPal, e c'è anche un
    draft IETF che ne standardizza l'header, benché sia scaduto senza diventare RFC.

    Il punto che separa un'implementazione corretta da una che sembra corretta è
    l'atomicità. Controllare "esiste già questa chiave?" e poi eseguire sono due
    operazioni distinte: fra le due ci sta una race, e due richieste parallele passano
    entrambe il controllo. La forma giusta è inserire la chiave con un vincolo di
    unicità *dentro la stessa transazione* che esegue l'operazione: il database diventa
    l'arbitro, una richiesta vince e l'altra riceve una violazione di unicità, che si
    traduce in "questa chiave esiste già".

    Ne segue che gli stati da gestire sono tre, non due. Chiave nuova: si esegue.
    Chiave completata: si restituisce la risposta salvata, con lo stesso status code.
    Chiave in corso: la prima richiesta sta ancora lavorando, e qui si risponde 409 (o
    si attende brevemente), perché rieseguire sarebbe proprio il doppio addebito che si
    vuole evitare. Va anche confrontato il corpo della richiesta con quello originale -
    di solito via hash - perché riusare la stessa chiave con parametri diversi è un
    errore del client che va segnalato, non assecondato.

    Idempotenza e deduplicazione si somigliano ma rispondono a domande diverse.
    L'idempotenza è una proprietà dell'operazione lato server, richiesta per richiesta.
    La deduplicazione è il filtro che si mette su un flusso di messaggi per scartare
    quelli già visti. Nei sistemi a messaggi le due si incontrano: poiché la consegna
    è quasi sempre at-least-once, il consumatore deve essere idempotente o deduplicare,
    altrimenti "exactly-once" resta una promessa da slide.

    Un'ultima nota di progetto: molte operazioni si possono rendere naturalmente
    idempotenti senza chiavi, scegliendo bene il modello. `PUT /carts/42/items/ABC
    {qty: 3}` è idempotente per costruzione, mentre "aggiungi una unità" non lo è. Un
    identificatore deciso dal client (UUID dell'ordine) trasforma una creazione in un
    upsert. Prima di costruire l'infrastruttura delle idempotency key, vale la pena
    chiedersi se il dominio si può modellare in modo che il problema non si presenti.
  key_points:
    - "Il problema reale: il client va in timeout e non sa se il pagamento è passato. Se ritenta, rischia il doppio addebito"
    - "Soluzione standard: idempotency key generata dal client, salvata dal server con il risultato della prima esecuzione"
    - "Una chiave per tentativo logico, non per retry: se la rigeneri a ogni retry non serve a niente"
    - "Alla seconda richiesta con la stessa chiave il server NON riesegue: restituisce la risposta memorizzata"
    - "La chiave va inserita con un vincolo di unicità nella stessa transazione dell'operazione, altrimenti due richieste parallele passano entrambe"
    - "Vanno gestiti tre stati: chiave nuova, chiave già completata (restituisci il risultato), chiave in corso (409 o attesa)"
    - "Va confrontato anche l'hash del corpo: stessa chiave con parametri diversi è un errore del client (422), non una ripetizione"
    - "Le chiavi hanno un TTL: 24 ore è una scelta comune"
    - "Molte operazioni si rendono idempotenti per modellazione (PUT con id scelto dal client) senza bisogno di chiavi"
  examples:
    - title: Lo schema e la transazione che rende tutto atomico
      language: sql
      code: |-
        CREATE TABLE idempotency_keys (
          key          text PRIMARY KEY,           -- l'unicità è il cuore del meccanismo
          user_id      uuid NOT NULL,
          request_hash bytea NOT NULL,             -- per accorgersi del riuso con corpo diverso
          state        text NOT NULL,              -- in_progress | done
          status_code  int,
          response     jsonb,
          created_at   timestamptz NOT NULL DEFAULT now()
        );

        BEGIN;
          -- Se la chiave esiste già, questa INSERT non fa nulla: niente race.
          INSERT INTO idempotency_keys (key, user_id, request_hash, state)
          VALUES (:key, :user, :hash, 'in_progress')
          ON CONFLICT (key) DO NOTHING;
          -- ... se ho inserito io, eseguo il pagamento nella STESSA transazione ...
          INSERT INTO payments (id, user_id, amount_cents) VALUES (:pid, :user, :amount);
          UPDATE idempotency_keys
             SET state = 'done', status_code = 201, response = :body
           WHERE key = :key;
        COMMIT;
      note: >-
        Se il processo muore a metà, la transazione non è committata: la chiave resta
        assente e il retry rifà tutto da capo, correttamente.
    - title: I tre stati lato applicazione
      language: python
      code: |-
        async def crea_pagamento(req: Richiesta, key: str, user: User) -> Response:
            corpo_hash = sha256(req.canonical_json().encode()).digest()
            riga = await repo.claim(key, user.id, corpo_hash)     # INSERT ... ON CONFLICT

            if riga.appena_creata:
                esito = await esegui_pagamento(req)               # stessa transazione
                await repo.completa(key, 201, esito)
                return Response(201, esito)

            if riga.request_hash != corpo_hash:
                raise HTTPException(422, "Idempotency-Key già usata con un corpo diverso")

            if riga.state == "done":
                return Response(riga.status_code, riga.response)   # replay della risposta

            # state == 'in_progress': la prima richiesta sta ancora lavorando
            raise HTTPException(409, "Richiesta con la stessa chiave in corso")
      note: >-
        Il ramo 409 è quello che quasi tutti dimenticano al colloquio, ed è proprio il
        caso in cui il doppio addebito si verificherebbe.
  trade_offs:
    - option: Idempotency key esplicita
      pros: Funziona su qualunque operazione, anche con effetti esterni
      cons: Tabella, TTL, pulizia, tre stati da gestire correttamente
      when: "Pagamenti, ordini, invii: tutto ciò che non si può ripetere"
    - option: Identificatore scelto dal client (upsert)
      pros: Idempotenza gratis, nessuna infrastruttura aggiuntiva
      cons: Richiede che il client sappia generare id e che il dominio lo permetta
      when: Creazione di risorse il cui id può essere un UUID lato client
    - option: Deduplicazione a valle (sul consumatore)
      pros: Protegge anche da duplicati prodotti da altri (broker, retry interni)
      cons: Non evita l'esecuzione doppia, la scarta dopo; serve uno store dei visti
      when: Consumatori di code, dove la consegna è at-least-once
  numbers:
    - "TTL delle chiavi: 24 ore da Stripe in poi è lo standard di fatto"
    - "Dimensione tipica della chiave: un UUIDv4, 36 caratteri"
    - "Il doppio addebito costa molto più del lavoro per evitarlo: un chargeback in Europa costa tipicamente 15-25 euro oltre all'importo"
  interview_answer: >-
    Il caso che uso per spiegarlo è il pagamento: il client manda la richiesta, scade il
    timeout e non sa se l'addebito è avvenuto. Senza idempotenza ogni retry è un rischio di
    doppio addebito. Faccio generare al client una idempotency key, un UUID per tentativo
    logico, e sul server la salvo con un vincolo di unicità dentro la stessa transazione
    che esegue l'operazione. Così se arrivano due richieste in parallelo, una sola vince
    sul constraint e l'altra trova la chiave già presente e restituisce il risultato
    memorizzato invece di rieseguire. La parte che si dimentica spesso è proprio lo stato
    intermedio, la richiesta ancora in corso: lì rispondo 409 e lascio ritentare. E prima
    di tutto questo guardo se posso modellare l'operazione come un PUT con id scelto dal
    client, che è idempotente senza infrastruttura.
  senior_signals:
    - "Mette l'inserimento della chiave nella stessa transazione e sa dire perché"
    - "Gestisce lo stato 'in corso' e non solo nuovo/completato"
    - "Confronta l'hash del corpo per intercettare il riuso scorretto della chiave"
    - "Propone la modellazione idempotente come alternativa prima di costruire la tabella"
  pitfalls:
    - "Controllare l'esistenza della chiave PRIMA della transazione: fra il controllo e l'inserimento ci sta una race"
    - "Non gestire lo stato 'in corso' e permettere due esecuzioni concorrenti"
    - "Chiave generata dal server: non serve a nulla, cambia a ogni retry"
    - "Rigenerare la chiave a ogni tentativo lato client: stesso effetto di non averla"
    - "Salvare il risultato ma non lo status code: il replay risponde 200 dove la prima volta era 201"
  follow_ups:
    - question: Cosa succede se due richieste con la stessa idempotency key arrivano contemporaneamente?
      answer: >-
        Vince chi riesce a inserire la chiave: il vincolo di unicità fa da arbitro. La
        seconda riceve una violazione, legge la riga e trova lo stato `in_progress`,
        quindi risponde 409 e invita a ritentare, oppure attende brevemente e poi
        restituisce la risposta memorizzata. Ciò che non deve succedere è che entrambe
        eseguano: per questo il controllo e l'esecuzione stanno nella stessa transazione.
    - question: Che differenza c'è tra idempotenza e deduplicazione?
      answer: >-
        L'idempotenza è una proprietà dell'operazione: eseguirla N volte equivale a
        eseguirla una volta. La deduplicazione è un filtro a valle: riconosco un
        messaggio già visto e lo scarto. La prima è progettata nell'API, la seconda nel
        consumatore. Nei sistemi a code servono entrambe, perché la consegna è
        at-least-once e i duplicati arrivano comunque.
    - question: E se l'operazione chiama un servizio esterno che non è idempotente?
      answer: >-
        Allora la mia chiave deve propagarsi: quasi tutti i PSP accettano a loro volta un
        Idempotency-Key, e gli mando lo stesso valore, così la catena resta idempotente.
        Dove il servizio esterno non lo supporta, registro l'esito prima di rispondere e
        uso il pattern outbox con un identificatore correlato, in modo che il retry possa
        interrogare lo stato invece di rifare la chiamata.
    - question: Per quanto tempo conservi le chiavi e cosa succede dopo la scadenza?
      answer: >-
        24 ore è il valore di riferimento: copre ampiamente i retry automatici e i
        tentativi manuali. Dopo la scadenza la chiave sparisce e una richiesta con quello
        stesso valore verrebbe eseguita di nuovo, quindi il TTL va scelto più lungo della
        finestra di retry più aggressiva dei miei client e documentato nel contratto.
