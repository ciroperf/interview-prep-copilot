    Ordina il risultato per frequenza decrescente e, a parità di frequenza, per valore
    crescente.
  function_name: top_k_frequent
  starter_code: |
    def top_k_frequent(nums: list[int], k: int) -> list[int]:
        # Il tuo codice qui
        pass
  examples:
    - "top_k_frequent([1,1,1,2,2,3], 2) -> [1, 2]"
  hints:
    - "Prima conta le occorrenze con un dizionario."
    - "Ordinare tutto costa O(n log n): con un heap di dimensione k scendi a O(n log k)."
    - "Attenzione al criterio di parità richiesto dalla consegna."
  tests:
    - kwargs: {nums: [1, 1, 1, 2, 2, 3], k: 2}
      expected: [1, 2]
    - kwargs: {nums: [1], k: 1}
      expected: [1]
    - kwargs: {nums: [4, 4, 5, 5, 6], k: 2}
      expected: [4, 5]
    - kwargs: {nums: [3, 3, 1, 1, 2], k: 3}
      expected: [1, 3, 2]
      hidden: true
  solution: |
    def top_k_frequent(nums: list[int], k: int) -> list[int]:
        from collections import Counter

        counts = Counter(nums)
        ordered = sorted(counts.items(), key=lambda kv: (-kv[1], kv[0]))
        return [value for value, _ in ordered[:k]]

- id: p-num-islands
  title: Numero di isole
  topic_ids: [dsa-09-graphs]
  tags: [grafi, bfs, dfs, matrice]
  difficulty: medium
  estimated_minutes: 35
  target_complexity: "O(righe * colonne) tempo"
  statement: |
    Data una griglia di caratteri dove `1` è terra e `0` è acqua, conta il numero di
    isole.

    Un'isola è un gruppo di celle di terra collegate orizzontalmente o verticalmente (non
    in diagonale). La griglia è circondata da acqua.
  function_name: num_islands
  starter_code: |
    def num_islands(grid: list[list[str]]) -> int:
        # Il tuo codice qui
        pass
  examples:
    - "num_islands([['1','1','0'],['0','1','0'],['0','0','1']]) -> 2"
  hints:
    - "Una matrice con celle adiacenti è un grafo travestito."
    - "Scorri tutte le celle: quando trovi terra non ancora visitata, hai trovato una nuova isola."
    - "Da quella cella esplora con BFS o DFS tutta l'isola marcandola come visitata."
  tests:
    - kwargs:
        grid: [["1", "1", "0"], ["0", "1", "0"], ["0", "0", "1"]]
      expected: 2
    - kwargs:
        grid: [["1", "1", "1"], ["1", "1", "1"]]
      expected: 1
    - kwargs:
        grid: [["0", "0"], ["0", "0"]]
      expected: 0
    - kwargs:
        grid: []
      expected: 0
      hidden: true
    - kwargs:
        grid: [["1", "0", "1", "0", "1"]]
      expected: 3
      hidden: true
  solution: |
    def num_islands(grid: list[list[str]]) -> int:
        if not grid or not grid[0]:
            return 0
        rows, cols = len(grid), len(grid[0])
        seen = set()
        count = 0

        def flood(r0: int, c0: int) -> None:
            stack = [(r0, c0)]
            while stack:
                r, c = stack.pop()
                for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                    nr, nc = r + dr, c + dc
                    if 0 <= nr < rows and 0 <= nc < cols:
                        if grid[nr][nc] == "1" and (nr, nc) not in seen:
                            seen.add((nr, nc))
                            stack.append((nr, nc))

        for r in range(rows):
            for c in range(cols):
                if grid[r][c] == "1" and (r, c) not in seen:
                    seen.add((r, c))
                    flood(r, c)
                    count += 1
        return count

- id: p-course-schedule
  title: Fattibilità del piano di studi (ordinamento topologico)
  topic_ids: [dsa-09-graphs]
  tags: [grafi, topologico, cicli]
  difficulty: medium
  estimated_minutes: 35
  target_complexity: "O(V + E) tempo"
  statement: |
    Ci sono `num_courses` corsi numerati da 0 a num_courses-1. Ogni prerequisito è una
    coppia `[a, b]` che significa: per seguire il corso `a` devi aver completato `b`.

    Restituisci True se è possibile completare tutti i corsi, False altrimenti.
  function_name: can_finish
  starter_code: |
    def can_finish(num_courses: int, prerequisites: list[list[int]]) -> bool:
        # Il tuo codice qui
        pass
  examples:
    - "can_finish(2, [[1, 0]]) -> True"
    - "can_finish(2, [[1, 0], [0, 1]]) -> False  # dipendenza circolare"
  hints:
    - "I corsi e i prerequisiti formano un grafo diretto. Quando è impossibile completarli tutti?"
    - "È impossibile se e solo se esiste un ciclo."
    - "Usa l'algoritmo di Kahn: parti dai nodi con grado entrante zero e rimuovili uno a uno."
  tests:
    - kwargs: {num_courses: 2, prerequisites: [[1, 0]]}
      expected: true
    - kwargs: {num_courses: 2, prerequisites: [[1, 0], [0, 1]]}
      expected: false
    - kwargs: {num_courses: 3, prerequisites: []}
      expected: true
    - kwargs: {num_courses: 4, prerequisites: [[1, 0], [2, 1], [3, 2]]}
      expected: true
      hidden: true
    - kwargs: {num_courses: 3, prerequisites: [[0, 1], [1, 2], [2, 0]]}
      expected: false
      hidden: true
  solution: |
    def can_finish(num_courses: int, prerequisites: list[list[int]]) -> bool:
        from collections import deque

        adj: list[list[int]] = [[] for _ in range(num_courses)]
        indegree = [0] * num_courses
        for course, prereq in prerequisites:
            adj[prereq].append(course)
            indegree[course] += 1

        queue = deque(i for i in range(num_courses) if indegree[i] == 0)
        done = 0
        while queue:
            node = queue.popleft()
            done += 1
            for nxt in adj[node]:
                indegree[nxt] -= 1
                if indegree[nxt] == 0:
                    queue.append(nxt)
        return done == num_courses

- id: p-coin-change
  title: Resto con il minimo numero di monete
  topic_ids: [dsa-11-dynamic-programming]
  tags: [dp, ottimizzazione]
  difficulty: medium
  estimated_minutes: 35
  target_complexity: "O(amount * len(coins)) tempo"
  statement: |
    Dato un elenco di tagli di monete `coins` e un importo `amount`, restituisci il numero
    minimo di monete necessarie per comporre esattamente quell'importo.

    Se non è possibile, restituisci -1. Hai a disposizione infinite monete di ogni taglio.
  function_name: coin_change
  starter_code: |
    def coin_change(coins: list[int], amount: int) -> int:
        # Il tuo codice qui
        pass
  examples:
    - "coin_change([1, 2, 5], 11) -> 3  # 5 + 5 + 1"
    - "coin_change([2], 3) -> -1"
  hints:
    - "L'approccio greedy (prendi sempre la moneta più grande) non funziona: prova con coins=[1,3,4] e amount=6."
    - "Definisci dp[x] = numero minimo di monete per comporre x."
    - "dp[x] = 1 + min(dp[x - moneta]) per ogni moneta che sta in x."
  tests:
    - kwargs: {coins: [1, 2, 5], amount: 11}
      expected: 3
    - kwargs: {coins: [2], amount: 3}
      expected: -1
    - kwargs: {coins: [1], amount: 0}
      expected: 0
    - kwargs: {coins: [1, 3, 4], amount: 6}
      expected: 2
      hidden: true
    - kwargs: {coins: [186, 419, 83, 408], amount: 6249}
      expected: 20
      hidden: true
  solution: |
    def coin_change(coins: list[int], amount: int) -> int:
        INF = float("inf")
        dp = [0] + [INF] * amount
        for value in range(1, amount + 1):
            for coin in coins:
                if coin <= value and dp[value - coin] + 1 < dp[value]:
                    dp[value] = dp[value - coin] + 1
        return -1 if dp[amount] == INF else int(dp[amount])

- id: p-search-rotated
  title: Ricerca in array ordinato e ruotato
  topic_ids: [dsa-05-binary-search]
  tags: [ricerca-binaria, array]
  difficulty: medium
  estimated_minutes: 35
  target_complexity: "O(log n) tempo"
  statement: |
    Un array ordinato in modo crescente e con valori distinti è stato ruotato in un punto
    sconosciuto. Dato `target`, restituisci il suo indice, oppure -1 se non è presente.

    L'algoritmo deve essere logaritmico.
  function_name: search_rotated
  starter_code: |
    def search_rotated(nums: list[int], target: int) -> int:
        # Il tuo codice qui
        pass
  examples:
    - "search_rotated([4,5,6,7,0,1,2], 0) -> 4"
    - "search_rotated([4,5,6,7,0,1,2], 3) -> -1"
  hints:
    - "Dividendo l'array a metà, almeno una delle due metà è sicuramente ordinata."
    - "Capisci quale metà è ordinata confrontando l'estremo con il valore centrale."
    - "Se il target sta nell'intervallo della metà ordinata, cercalo lì; altrimenti vai nell'altra."
  tests:
    - kwargs: {nums: [4, 5, 6, 7, 0, 1, 2], target: 0}
      expected: 4
    - kwargs: {nums: [4, 5, 6, 7, 0, 1, 2], target: 3}
      expected: -1
    - kwargs: {nums: [1], target: 1}
      expected: 0
    - kwargs: {nums: [], target: 5}
      expected: -1
      hidden: true
    - kwargs: {nums: [5, 1, 3], target: 3}
      expected: 2
      hidden: true
  solution: |
    def search_rotated(nums: list[int], target: int) -> int:
        lo, hi = 0, len(nums) - 1
        while lo <= hi:
            mid = (lo + hi) // 2
            if nums[mid] == target:
                return mid
            if nums[lo] <= nums[mid]:
                if nums[lo] <= target < nums[mid]:
                    hi = mid - 1
                else:
                    lo = mid + 1
            else:
                if nums[mid] < target <= nums[hi]:
                    lo = mid + 1
                else:
                    hi = mid - 1
        return -1

- id: p-min-window
  title: Sottostringa minima che copre tutti i caratteri
  topic_ids: [dsa-12-sliding-window, dsa-03-hash-maps]
  tags: [sliding-window, stringhe, hard]
  difficulty: hard
  estimated_minutes: 45
  target_complexity: "O(len(s) + len(t)) tempo"
  statement: |
    Date due stringhe `s` e `t`, restituisci la sottostringa più corta di `s` che contiene
    tutti i caratteri di `t`, molteplicità incluse.

    Se non esiste, restituisci la stringa vuota. La soluzione è garantita unica.
  function_name: min_window
  starter_code: |
    def min_window(s: str, t: str) -> str:
        # Il tuo codice qui
        pass
  examples:
    - "min_window('ADOBECODEBANC', 'ABC') -> 'BANC'"
  hints:
    - "Espandi il bordo destro finché la finestra non contiene tutto t."
    - "Quando è valida, contrai da sinistra il più possibile mantenendola valida, e aggiorna il minimo."
    - "Tieni un contatore di quanti caratteri richiesti sono già soddisfatti per evitare di riconfrontare le mappe ogni volta."
  tests:
    - kwargs: {s: "ADOBECODEBANC", t: "ABC"}
      expected: "BANC"
    - kwargs: {s: "a", t: "a"}
      expected: "a"
    - kwargs: {s: "a", t: "aa"}
      expected: ""
    - kwargs: {s: "ab", t: "b"}
      expected: "b"
      hidden: true
    - kwargs: {s: "", t: "a"}
      expected: ""
      hidden: true
  solution: |
    def min_window(s: str, t: str) -> str:
        from collections import Counter

        if not s or not t:
            return ""
        need = Counter(t)
        missing = len(t)
        best_start, best_len = 0, -1
        left = 0
        for right, ch in enumerate(s):
            if need[ch] > 0:
                missing -= 1
            need[ch] -= 1
            while missing == 0:
                if best_len == -1 or right - left + 1 < best_len:
                    best_start, best_len = left, right - left + 1
                need[s[left]] += 1
                if need[s[left]] > 0:
                    missing += 1
                left += 1
        return "" if best_len == -1 else s[best_start : best_start + best_len]
