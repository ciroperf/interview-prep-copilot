      url: https://www.oreilly.com/radar/the-world-beyond-batch-streaming-101/
      kind: article
    - title: "Designing Data-Intensive Applications, capitolo 11"
      url: https://dataintensive.net/
      kind: book
    - title: "Apache Flink - Event time e watermark"
      url: https://nightlies.apache.org/flink/flink-docs-stable/docs/concepts/time/
      kind: doc

- id: sd-11-realtime-connections
  title: Tempo reale, WebSocket e presenza
  category: system-design
  track: technical
  level: hard
  tags: [system-design, websocket, realtime, sse, presenza]
  estimated_minutes: 40
  summary: >-
    Spingere dati verso il browser sembra una scelta di protocollo e in realta' e' una
    scelta di architettura: le connessioni persistenti rendono i server stateful, e da lì
    discendono il bilanciamento, il deploy e il modo in cui i messaggi trovano l'utente.
  deep_dive: |-
    Le opzioni sono tre e vanno distinte prima di parlare di scala. Il polling ripetuto e'
    la piu' semplice: il client chiede ogni N secondi, il server risponde subito. Spreca
    richieste ma e' banale da gestire, cachabile, e per molti casi - un cruscotto che si
    aggiorna ogni trenta secondi - e' la risposta corretta. Server-Sent Events e' un flusso
    HTTP unidirezionale dal server al client, con riconnessione automatica e ripresa
    dall'ultimo identificativo ricevuto gia' nel protocollo: e' la scelta giusta quando i
    dati vanno in una direzione sola, cioe' notifiche, aggiornamenti di stato, cruscotti.
    WebSocket apre un canale bidirezionale dopo un upgrade HTTP, e serve davvero quando il
    client deve mandare messaggi con la stessa frequenza con cui li riceve: chat,
    collaborazione, giochi. Scegliere WebSocket per mandare notifiche in una sola direzione
    e' il caso piu' comune di complessita' non necessaria.

    Il salto architetturale e' che con una connessione persistente il server smette di
    essere intercambiabile. Un utente non e' piu' "chiunque risponda" ma "quel processo su
    quel nodo", e questo cambia tre cose. Il bilanciamento non puo' distribuire per
    richiesta perche' la richiesta e' una sola e dura ore, quindi si distribuiscono le
    connessioni e si finisce sbilanciati, perche' un nodo riavviato di recente ne ha poche.
    Il deploy diventa disturbante: riavviare un nodo chiude migliaia di connessioni, che si
    riconnettono tutte insieme, e senza jitter nel backoff del client si ottiene una
    tempesta che rimbalza fra i nodi. E il conteggio delle connessioni diventa un limite di
    capacita' vero, perche' ogni connessione consuma memoria e un descrittore di file anche
    quando non passa traffico.

    Il problema che segue e' l'instradamento. Il servizio che genera un messaggio - un
    worker, un altro microservizio - non sa su quale nodo sia connesso il destinatario, e
    non deve saperlo. La soluzione standard e' un backplane di pubblicazione e
    sottoscrizione: ogni nodo si sottoscrive ai canali degli utenti che ha connessi, chi
    produce il messaggio lo pubblica sul canale e il nodo giusto lo riceve e lo inoltra.
    Redis pub/sub e' l'implementazione tipica per volumi medi; sopra si passa a sistemi che
    persistono. Il dettaglio che distingue una soluzione seria e' che il pub/sub puro non
    conserva nulla: se l'utente e' momentaneamente disconnesso il messaggio si perde. Per
    una chat questo non e' accettabile, quindi il messaggio va prima persistito con un
    numero di sequenza per conversazione, e la consegna in tempo reale diventa
    un'ottimizzazione sopra un recupero che il client fa comunque alla riconnessione
    chiedendo "tutto dopo la sequenza N". Progettare la riconnessione prima del tempo reale
    e' il modo giusto di ordinare il lavoro.

    La presenza - chi e' online - ha una sua trappola. Sembra derivabile dalla connessione
    aperta, ma una connessione puo' restare aperta su un client sparito, e un utente puo'
    avere cinque dispositivi. Si implementa con un heartbeat e una chiave con TTL per
    dispositivo: il client conferma periodicamente, la chiave scade se smette, e l'utente e'
    online se almeno uno dei suoi dispositivi ha la chiave viva. La granularita' va tenuta
    grossolana, perche' la presenza precisa al secondo per migliaia di contatti genera un
    fan-out enorme per un'informazione che nessuno guarda con quella attenzione.
  key_points:
    - "Tre opzioni: polling (semplice, cachabile), SSE (unidirezionale, riconnessione nel protocollo), WebSocket (bidirezionale)"
    - "SSE basta per notifiche e cruscotti: WebSocket per una sola direzione e' complessita' non necessaria"
    - "Le connessioni persistenti rendono i nodi stateful: il bilanciamento distribuisce connessioni, non richieste"
    - "Il deploy chiude migliaia di connessioni insieme: serve backoff con jitter lato client o si ottiene una tempesta"
    - "Il produttore del messaggio non sa dove e' connesso il destinatario: serve un backplane pub/sub fra i nodi"
    - "Il pub/sub puro non persiste: il messaggio va salvato con un numero di sequenza e recuperato alla riconnessione"
    - "Progettare prima la riconnessione ('dammi tutto dopo N') e poi il tempo reale come ottimizzazione"
    - "Presenza: heartbeat e chiave con TTL per dispositivo, con granularita' volutamente grossolana"
  examples:
    - title: Scegliere il protocollo dal verso dei dati
      language: text
      code: |
        Notifiche, cruscotto, stato di un ordine, avanzamento di un job
          dati: server -> client, solo
          SSE          riconnessione e Last-Event-ID nel protocollo,
                       passa dai proxy come un normale HTTP,
                       una riga di codice sul client
          WebSocket    stessa funzione, piu' codice, piu' problemi

        Chat, editing collaborativo, gioco, terminale remoto
          dati: bidirezionali e frequenti
          WebSocket    giustificato

        Cruscotto che tollera 30 secondi
          polling      cachabile, stateless, nessun backplane
                       spesso e' la risposta giusta e la si scarta per moda

        Limite storico di SSE: 6 connessioni per dominio su HTTP/1.1.
        Con HTTP/2 il multiplexing lo rende irrilevante.
      note: >-
        La domanda da farsi e' "il client deve mandare qualcosa con la stessa frequenza con
        cui riceve?". Se la risposta e' no, SSE fa lo stesso lavoro con meno parti mobili.
    - title: Perche' il pub/sub da solo non basta per una chat
      language: text
      code: |
        SOLO PUB/SUB (fragile)
          Anna manda "ciao" -> pubblicato sul canale user:bruno
          Bruno e' in metropolitana, disconnesso da 4 secondi
          nessun nodo ha quel canale -> il messaggio evapora
          Bruno torna online: non sapra' mai che Anna ha scritto

        PERSISTENZA + SEQUENZA (corretto)
          1. messaggio salvato:  conversazione 77, seq 1043
          2. pubblicato sul canale (ottimizzazione per chi e' connesso)
          3. Bruno si riconnette e chiede: "conversazione 77, dopo seq 1041"
             -> riceve 1042 e 1043

          il tempo reale e' un'ottimizzazione del passo 3, non il meccanismo
          di consegna

        La sequenza per conversazione da' anche l'ordinamento e permette
        la deduplicazione: lo stesso messaggio consegnato due volte ha la
        stessa seq e il client lo ignora.
      note: >-
        Costruire prima il recupero e poi il push rende il sistema corretto anche quando il
        push fallisce. Nell'ordine inverso, ogni disconnessione e' una perdita di dati.
  trade_offs:
    - option: Polling periodico
      pros: Stateless, cachabile, nessun backplane, deploy indolore
      cons: Latenza pari all'intervallo, richieste sprecate quando non cambia nulla
      when: Tolleranza di decine di secondi, pochi client, o come primo passo prima di ottimizzare
    - option: Server-Sent Events
      pros: Riconnessione e ripresa nel protocollo, HTTP normale, client semplicissimo
      cons: Una direzione sola, e su HTTP/1.1 il limite di connessioni per dominio
      when: "Notifiche, aggiornamenti di stato, cruscotti: la maggior parte dei casi reali"
    - option: WebSocket
      pros: Bidirezionale, latenza minima, adatto a traffico frequente in entrambi i versi
      cons: Nodi stateful, backplane, deploy disturbante, riconnessione da implementare a mano
      when: Chat, collaborazione, giochi, cioe' quando il client scrive quanto legge
  numbers:
    - "Una connessione inattiva costa comunque memoria e un descrittore: le migliaia per nodo sono un limite di capacita' reale, da misurare"
    - "Heartbeat di presenza ogni 20-30 secondi con TTL della chiave a 2-3 volte l'intervallo: piu' frequente non aggiunge informazione utile"
    - "Backoff di riconnessione con jitter: senza il termine casuale tutti i client tornano insieme e replicano il picco a ogni tentativo"
  interview_answer: >-
    Prima decido il verso dei dati, perche' cambia tutto. Se vanno solo dal server al client -
    notifiche, stato di un ordine, un cruscotto - uso Server-Sent Events, che ha riconnessione e
    ripresa dall'ultimo evento gia' dentro il protocollo e passa dai proxy come HTTP normale.
    WebSocket lo tengo per quando il client scrive con la stessa frequenza con cui legge, cioe'
    chat e collaborazione. La parte architetturale e' che una connessione persistente rende il
    nodo stateful: il bilanciamento distribuisce connessioni e non richieste, un deploy ne chiude
    migliaia insieme e senza jitter nel backoff si ottiene una tempesta di riconnessioni. Chi
    produce il messaggio non sa su quale nodo sia l'utente, quindi metto un backplane pub/sub fra
    i nodi. E soprattutto progetto prima la riconnessione: persisto il messaggio con un numero di
    sequenza e il client alla riconnessione chiede tutto quello che c'e' dopo l'ultimo che ha, poi
    il push in tempo reale diventa un'ottimizzazione. Al contrario, ogni disconnessione sarebbe
    una perdita di messaggi.
  senior_signals:
    - "Sceglie SSE quando il verso e' uno solo, invece di andare su WebSocket per abitudine"
    - "Nomina il fatto che le connessioni persistenti rendono i nodi stateful e ne trae le conseguenze su bilanciamento e deploy"
    - "Progetta il recupero alla riconnessione prima del push, e usa numeri di sequenza"
    - "Sa che il pub/sub puro non persiste e non lo usa come meccanismo di consegna"
    - "Cita il jitter nel backoff come difesa dalla tempesta di riconnessioni"
    - "Tiene la presenza grossolana e la implementa con heartbeat e TTL per dispositivo"
  pitfalls:
    - "Usare WebSocket per notifiche unidirezionali e ritrovarsi a implementare a mano cio' che SSE ha gia'"
    - "Affidare la consegna al solo pub/sub: chi e' disconnesso per due secondi perde i messaggi"
    - "Riconnessione senza jitter: tutti i client tornano insieme e la tempesta si ripete a ogni tentativo"
    - "Dimenticare che un deploy chiude tutte le connessioni e non prevedere un drenaggio graduale"
    - "Dedurre la presenza dalla connessione aperta: resta aperta su client spariti e ignora il multi-dispositivo"
    - "Non limitare le connessioni per utente: un client con un bug ne apre centinaia"
  follow_ups:
    - question: Quando SSE e' preferibile a WebSocket?
      answer: >-
        Ogni volta che i dati vanno in una direzione sola, che nella pratica e' la
        maggioranza dei casi: notifiche, avanzamento di un'elaborazione, aggiornamenti di un
        cruscotto, stato di un ordine. SSE e' HTTP normale, quindi attraversa proxy e
        bilanciatori senza configurazioni speciali, e porta gia' nel protocollo la
        riconnessione automatica e la ripresa tramite Last-Event-ID, che con WebSocket
        dovrei scrivere a mano e probabilmente scrivere male. Il limite storico delle sei
        connessioni per dominio su HTTP/1.1 non conta piu' con HTTP/2. Scelgo WebSocket
        quando il client deve mandare messaggi con la stessa frequenza con cui li riceve.
    - question: Come gestisci il deploy di un servizio con centomila connessioni aperte?
      answer: >-
        Con un drenaggio graduale invece di un riavvio secco. Il nodo in uscita smette di
        accettare nuove connessioni, poi chiude quelle esistenti a scaglioni - non tutte
        insieme - eventualmente inviando un messaggio applicativo che invita il client a
        riconnettersi dopo un ritardo casuale. Lato client servono comunque backoff
        esponenziale e jitter, altrimenti anche uno scaglione torna tutto nello stesso
        istante. La capacita' residua va verificata prima: se i nodi sono al novanta per
        cento delle connessioni, riavviarne uno significa che gli altri non reggono i suoi
        utenti, e il deploy diventa un incidente.
    - question: Come fai arrivare un messaggio a un utente connesso su un altro nodo?
      answer: >-
        Non provo a sapere dove sta. Ogni nodo si sottoscrive ai canali degli utenti che ha
        connessi, e chi produce il messaggio pubblica sul canale dell'utente: il nodo giusto
        lo riceve e lo inoltra sulla sua connessione. Cosi' il produttore resta ignaro della
        topologia e i nodi possono entrare e uscire liberamente. L'alternativa, cioe' un
        registro che mappa utente verso nodo, sembra piu' efficiente ma va tenuta coerente
        con le connessioni che cadono, ed e' una sorgente di stato stantio. In entrambi i
        casi il pub/sub non sostituisce la persistenza: il messaggio e' gia' salvato, quello
        che viaggia sul canale e' solo la notifica per chi e' online adesso.
    - question: Come implementi la presenza per un utente con piu' dispositivi?
      answer: >-
        Con una chiave per dispositivo, non per utente. Ogni sessione attiva scrive una
        chiave del tipo presenza:utente:dispositivo con un TTL di due o tre volte
        l'intervallo di heartbeat, e la rinnova a ogni battito; l'utente risulta online se
        esiste almeno una chiave viva. Il TTL fa il lavoro di pulizia da solo, anche quando
        la connessione muore senza un addio. Sul fan-out sono deliberatamente grossolano:
        non propago ogni cambiamento a tutti i contatti, ma aggrego e notifico le
        transizioni con un ritardo di qualche secondo, perche' la presenza precisa al
        secondo costa moltissimo e nessuno la guarda con quella precisione.
  related: [sd-06-feed-fanout, dist-29-service-communication, rel-32-retries-timeouts-breakers, rel-39-deployments, dist-26-load-balancing]
