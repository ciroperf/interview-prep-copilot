- id: sd-12-probabilistic-structures
  title: Strutture probabilistiche, quando una stima basta
  category: system-design
  track: technical
  level: hard
  tags: [system-design, bloom-filter, hyperloglog, memoria, stime]
  estimated_minutes: 35
  summary: >-
    Contare gli utenti unici o verificare se un elemento e' gia' stato visto sono operazioni
    che a volumi grandi costano piu' memoria di quanta ne valga la risposta. Le strutture
    probabilistiche scambiano una precisione che spesso non serve con ordini di grandezza
    di memoria in meno.
  deep_dive: |-
    L'intuizione da avere e' che la memoria esatta cresce con il numero di elementi
    distinti, e che moltissime domande non richiedono una risposta esatta. Quanti visitatori
    unici ha avuto la pagina ieri? Questo URL l'abbiamo gia' visitato? Quali sono i dieci
    termini piu' cercati? In tutti e tre i casi un errore dell'uno per cento e' invisibile,
    ma la struttura esatta richiede di tenere ogni elemento distinto in memoria.

    Il Bloom filter risponde a "questo elemento c'e'?" con due esiti asimmetrici:
    "sicuramente no" oppure "forse si'". E' un vettore di bit e k funzioni hash; si inserisce
    accendendo i k bit corrispondenti, e si interroga verificando se sono tutti accesi. Se
    anche uno solo e' spento l'elemento non c'e' di sicuro; se sono tutti accesi potrebbero
    esserlo per colpa di altri elementi, ed e' il falso positivo. Non esistono falsi
    negativi, ed e' questa asimmetria a renderlo utile: si mette davanti a una risorsa
    costosa per evitare l'accesso quando la risposta e' certamente no. Un database che
    riceve valanghe di richieste per chiavi inesistenti - il cosiddetto cache penetration -
    si protegge cosi'. I numeri sono buoni: con circa dieci bit per elemento si sta intorno
    all'uno per cento di falsi positivi, quindi dieci milioni di elementi occupano poco piu'
    di dieci megabyte contro le centinaia di un insieme vero. Il limite e' che non si puo'
    cancellare, perche' spegnere i bit di un elemento ne spegnerebbe anche per altri; se
    serve cancellare si usa un counting Bloom filter o un cuckoo filter, che pagano in
    memoria.

    HyperLogLog risponde a "quanti elementi distinti?" senza tenerli. Si basa sul fatto che,
    osservando gli hash degli elementi, la piu' lunga sequenza di zeri iniziali vista e'
    legata all'ordine di grandezza della cardinalita': se hai visto un hash che comincia con
    venti zeri, probabilmente hai visto circa due alla venti elementi distinti. Mediando
    l'osservazione su molti registri si ottiene una stima stabile. In Redis occupa dodici
    kilobyte con un errore standard intorno allo 0,8 per cento, e la proprieta' che lo rende
    prezioso in un sistema distribuito e' che due HyperLogLog si possono unire: ogni nodo
    tiene il suo, e l'unione da' la cardinalita' globale senza spostare i dati. Contare gli
    utenti unici del mese su venti nodi diventa l'unione di venti strutture da dodici
    kilobyte.

    Il Count-Min Sketch risponde a "quante volte e' comparso questo elemento?" con una
    matrice di contatori e diverse funzioni hash, restituendo il minimo fra le celle. Le
    collisioni possono solo aggiungere, quindi la stima e' sempre maggiore o uguale al vero:
    sovrastima, mai sottostima. Serve per trovare gli elementi frequenti - le chiavi calde
    di una cache, gli indirizzi che stanno abusando di un'API - dove sbagliare in eccesso su
    un elemento raro non fa danno.

    La regola per usarle bene e' una sola: vanno scelte sapendo in che direzione sbagliano, e
    il sistema va progettato perche' quell'errore sia innocuo. Un Bloom filter davanti a una
    cache e' ottimo perche' il falso positivo costa solo un accesso inutile; lo stesso
    filtro come controllo di sicurezza sarebbe un disastro, perche' lascerebbe passare
    qualcuno. Scegliere una struttura probabilistica per un saldo contabile e' l'errore
    speculare, e al colloquio si valuta esattamente la capacita' di distinguere i due casi.
  key_points:
    - "Rispondono a domande che non richiedono esattezza, con ordini di grandezza di memoria in meno"
    - "Bloom filter: 'sicuramente no' o 'forse si'. Nessun falso negativo, ed e' l'asimmetria che lo rende utile"
    - "Circa 10 bit per elemento danno l'1% di falsi positivi: 10 milioni di elementi in poco piu' di 10 MB"
    - "Dal Bloom filter non si cancella: servono counting Bloom o cuckoo filter, che costano di piu'"
    - "HyperLogLog stima la cardinalita': in Redis 12 KB con ~0,8% di errore, e due strutture si possono unire"
    - "L'unione di HyperLogLog permette di contare gli unici globali senza spostare i dati fra i nodi"
    - "Count-Min Sketch stima le frequenze e sovrastima sempre: adatto a trovare gli elementi piu' frequenti"
    - "La regola: scegliere sapendo in che direzione la struttura sbaglia e rendere quell'errore innocuo"
  examples:
    - title: Bloom filter davanti alla cache, contro le chiavi inesistenti
      language: text
      code: |
        PROBLEMA (cache penetration)
          richieste per id inesistenti -> cache miss sempre
          -> ogni richiesta arriva al database -> il database cade

        CON BLOOM FILTER (10 MB per 10 milioni di id esistenti)
          richiesta id=99999999
          bloom.contiene(id)?
            NO    -> 404 immediato, il database non viene toccato mai
            FORSE -> cache, poi database (l'1% di accessi inutili: innocuo)

        MEMORIA A CONFRONTO, 10 milioni di id
          set di interi in memoria   ~400 MB
          bloom filter all'1%        ~12 MB

        PERCHE' FUNZIONA: l'errore e' solo nella direzione "forse si'",
        cioe' un accesso in piu'. Non esiste il caso "dico no ed esisteva",
        che sarebbe un id valido dichiarato inesistente.
      note: >-
        Il filtro va ricostruito quando l'insieme cambia molto, perche' non si puo'
        cancellare: in pratica lo si rigenera periodicamente da zero, operazione economica
        e facile da schedulare.
    - title: Contare gli unici su venti nodi senza spostare i dati
      language: text
      code: |
        ESATTO
          ogni nodo tiene l'insieme degli utenti visti
          per il totale globale servono gli insiemi completi
          50 milioni di utenti x 8 byte = 400 MB per nodo, da trasferire e unire

        HYPERLOGLOG
          ogni nodo tiene un HLL da 12 KB
          totale globale = unione dei 20 HLL = 240 KB trasferiti
          errore ~0,8%: su 50 milioni sono +/- 400.000

        La domanda da fare: "questo numero finisce in un cruscotto o in una
        fattura?". Nel cruscotto lo 0,8% non lo nota nessuno. In fattura
        e' inaccettabile, e allora si conta esatto e si paga la memoria.
      note: >-
        L'unione senza perdita di precisione e' la proprieta' che rende HyperLogLog adatto
        ai sistemi distribuiti: si puo' anche tenere un HLL per ora e unirli per ottenere il
        giorno, la settimana o il mese senza ricalcolare nulla.
  trade_offs:
    - option: Struttura esatta (set, contatori per chiave)
      pros: Nessun errore, si puo' cancellare, facile da spiegare e da verificare
      cons: Memoria proporzionale agli elementi distinti, difficile da unire fra nodi
      when: Denaro, conformita', qualunque numero che un utente possa contestare
    - option: Bloom filter
      pros: Memoria costante e minima, nessun falso negativo, velocissimo
      cons: Falsi positivi, nessuna cancellazione, dimensione da decidere in anticipo
      when: Filtro davanti a una risorsa costosa, dove un accesso inutile e' innocuo
    - option: HyperLogLog
      pros: 12 KB per qualunque cardinalita', strutture unibili fra nodi e nel tempo
      cons: Solo cardinalita', errore intorno all'1%, non dice quali elementi
      when: Visitatori unici, dispositivi distinti, metriche di prodotto su cruscotti
    - option: Count-Min Sketch
      pros: Frequenze in memoria fissa, trova bene gli elementi piu' frequenti
      cons: Sovrastima gli elementi rari, non elenca le chiavi, serve conoscerle a parte
      when: Individuare chiavi calde, abusi, i primi N per frequenza
  numbers:
    - "Bloom filter: ~10 bit per elemento danno circa l'1% di falsi positivi, ~14 bit lo portano allo 0,1%"
    - "HyperLogLog in Redis: 12 KB fissi, errore standard 0,81%, indipendente dalla cardinalita'"
    - "Un set esatto di 10 milioni di interi a 64 bit costa centinaia di MB in memoria: due ordini di grandezza in piu' di un Bloom filter equivalente"
  interview_answer: >-
    Le tiro fuori quando la memoria esatta cresce con gli elementi distinti e la domanda non
    richiede una risposta esatta. Il caso che uso piu' spesso e' il Bloom filter davanti a una
    cache per fermare le richieste su chiavi che non esistono: risponde "sicuramente no" oppure
    "forse si'", non ha falsi negativi, e con una decina di bit per elemento tiene dieci milioni
    di identificativi in poco piu' di dieci megabyte contro le centinaia di un insieme vero. Il
    falso positivo mi costa solo un accesso inutile, quindi l'errore cade dalla parte innocua.
    Per i visitatori unici uso HyperLogLog, che sta in dodici kilobyte con meno dell'uno per
    cento di errore e soprattutto si unisce fra nodi, quindi ogni nodo tiene il suo e il totale
    globale e' l'unione, senza spostare dati. La regola che seguo e' sempre la stessa: scelgo
    sapendo in che direzione la struttura sbaglia e mi assicuro che quell'errore non faccia
    danno. Su un saldo o su una fattura conto esatto e pago la memoria.
  senior_signals:
    - "Formula il criterio in termini di direzione dell'errore, non di risparmio di memoria"
    - "Sa che il Bloom filter non ha falsi negativi e ne deduce l'uso come filtro davanti a una risorsa costosa"
    - "Cita l'unibilita' di HyperLogLog come la proprieta' che conta in un sistema distribuito"
    - "Ricorda che dal Bloom filter non si cancella e propone la rigenerazione periodica"
    - "Distingue i casi in cui l'approssimazione e' inaccettabile (fatture, saldi) senza che glielo si chieda"
  pitfalls:
    - "Usare un Bloom filter come controllo di sicurezza: il falso positivo lascia passare qualcuno"
    - "Provare a cancellare da un Bloom filter spegnendo i bit: si cancellano anche elementi altrui"
    - "Dimensionare il filtro per la cardinalita' di oggi: quando l'insieme cresce i falsi positivi esplodono"
    - "Usare HyperLogLog per un numero che compare in una fattura o in un report contestabile"
    - "Trattare la stima del Count-Min Sketch come esatta per gli elementi rari, dove sovrastima di piu'"
    - "Introdurre queste strutture quando i dati stanno comodamente in memoria: complessita' senza beneficio"
  follow_ups:
    - question: Perche' un Bloom filter non puo' avere falsi negativi?
      answer: >-
        Perche' l'inserimento accende bit e non li spegne mai. Se un elemento e' stato
        inserito, i k bit corrispondenti ai suoi hash sono accesi per costruzione, e
        nessuna operazione successiva li spegne: quindi l'interrogazione di quell'elemento
        li trovera' sempre tutti accesi e rispondera' "forse si'". Il caso contrario, cioe'
        tutti i bit accesi per un elemento mai inserito, e' possibile perche' altri elementi
        possono aver acceso proprio quei bit, ed e' il falso positivo. E' anche il motivo
        per cui la cancellazione e' impossibile: spegnere i bit di un elemento potrebbe
        spegnerne di condivisi con altri, e allora comparirebbero i falsi negativi.
    - question: Come dimensioni un Bloom filter?
      answer: >-
        Servono due numeri: quanti elementi ci metterai e quale tasso di falsi positivi
        accetti. Da questi si ricavano la dimensione del vettore di bit e il numero ottimale
        di funzioni hash, con un rapporto di circa dieci bit per elemento per stare all'uno
        per cento e quattordici per lo 0,1. Il punto critico e' la stima del numero di
        elementi: se e' sottostimata, il filtro si satura e il tasso di falsi positivi
        peggiora rapidamente, fino a rispondere "forse si'" a tutto e diventare inutile. Per
        questo in pratica si sovradimensiona, si monitora il rapporto di bit accesi e si
        rigenera il filtro quando l'insieme cresce oltre le attese.
    - question: Quando NON useresti una struttura probabilistica?
      answer: >-
        Quando il numero e' contestabile o ha conseguenze. Una fattura basata su un conteggio
        stimato non e' difendibile; una soglia contrattuale, un limite di quota che blocca un
        cliente, un saldo, un controllo di autorizzazione vogliono strutture esatte. Ci
        aggiungo un secondo caso meno ovvio: quando i dati stanno comodamente in memoria. Se
        gli elementi distinti sono centomila, un insieme esatto costa pochi megabyte ed e'
        piu' semplice, piu' verificabile e senza sorprese; introdurre un Bloom filter lì e'
        complessita' che non compra nulla. Queste strutture si giustificano dai milioni di
        elementi in su.
    - question: Come useresti un Count-Min Sketch per trovare le chiavi calde?
      answer: >-
        Il Count-Min Sketch da' la frequenza stimata di una chiave che gli chiedi, ma non
        sa elencare le chiavi, quindi da solo non basta: si abbina a una struttura che tiene
        i primi N, tipicamente uno heap di dimensione fissa. Per ogni evento si aggiorna lo
        sketch, si legge la stima della chiave e, se supera la piu' piccola nello heap, la si
        inserisce. Cosi' con memoria costante si ottengono i candidati caldi. Il fatto che lo
        sketch sovrastimi lavora a favore: una chiave davvero calda non verra' mai
        sottostimata e quindi non sfuggira'; al massimo entrera' nei candidati qualche chiave
        che calda non e', e la si scarta con una verifica successiva.
