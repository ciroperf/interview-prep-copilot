name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}-api

jobs:
  # La costruzione non richiede alcun segreto Azure: serve solo GITHUB_TOKEN,
  # che Actions fornisce da solo. È il percorso per chi non ha Docker in locale.
  build:
    name: Build e push su GHCR
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Riepilogo
        id: meta
        run: |
          echo "image=${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          {
            echo "### Immagine pubblicata"
            echo
            echo '```'
            echo "${IMAGE}:${{ github.sha }}"
            echo "${IMAGE}:latest"
            echo '```'
            echo
            echo "Per portarla in Azure dal tuo computer, senza Docker:"
            echo
            echo '```powershell'
            echo ".\\scripts\\update-api.ps1"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # L'aggiornamento della Container App parte solo se hai configurato il login
  # federato. Senza, l'immagine resta su GHCR e la porti in Azure con
  # scripts/update-api.ps1, che usa la az CLI che hai gia' installato.
  azure:
    name: Aggiorna la Container App
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_CONFIGURED: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - name: Verifica se il deploy automatico è configurato
        id: check
        run: |
          if [ -n "$AZURE_CONFIGURED" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Segreti Azure non configurati: l'immagine è pronta su GHCR." >> "$GITHUB_STEP_SUMMARY"
            echo "Aggiorna la Container App con: .\\scripts\\update-api.ps1" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Login ad Azure
        if: steps.check.outputs.enabled == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Aggiorna la Container App
        if: steps.check.outputs.enabled == 'true'
        # Si punta al digest immutabile del commit, non a :latest: così una
        # revisione resta sempre riconducibile al codice che la ha prodotta.
        run: |
          az containerapp update \
            --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.build.outputs.image }}" \
            --output none

      - name: Verifica che la nuova revisione risponda
        if: steps.check.outputs.enabled == 'true'
        run: |
          FQDN=$(az containerapp show \
            --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)

          echo "Attendo che https://$FQDN risponda…"
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://$FQDN/api/health" || true)
            if [ "$code" = "200" ]; then
              echo "OK dopo $attempt tentativi."
              curl -s "https://$FQDN/api/meta" | head -c 400
              exit 0
            fi
            sleep 10
          done
          echo "L'health check non è passato: controlla i log della revisione." >&2
          exit 1
