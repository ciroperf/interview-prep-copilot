name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

# Serve per pubblicare su GHCR e per il login federato ad Azure (OIDC).
permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login ad Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Aggiorna la Container App
        # Si punta al digest immutabile del commit, non a :latest: così una
        # revisione resta sempre riconducibile al codice che la ha prodotta.
        run: |
          az containerapp update \
            --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE }}:${{ github.sha }}" \
            --output none

      - name: Verifica che la nuova revisione risponda
        run: |
          FQDN=$(az containerapp show \
            --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)

          echo "Attendo che https://$FQDN risponda…"
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://$FQDN/api/health" || true)
            if [ "$code" = "200" ]; then
              echo "OK dopo $attempt tentativi."
              curl -s "https://$FQDN/api/meta" | head -c 400
              exit 0
            fi
            sleep 10
          done
          echo "L'health check non è passato: controlla i log della revisione." >&2
          exit 1
