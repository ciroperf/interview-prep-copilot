name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installa le dipendenze
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # La build puo' riuscire e produrre lo stesso un sito inservibile: e'
      # gia' successo una volta, pubblicando il sorgente invece di dist/ e
      # servendo una pagina bianca con la pipeline verde. Questi controlli
      # guardano l'artefatto, non l'uscita del compilatore.
      - name: L'artefatto pubblicabile e' sano
        run: |
          set -e
          if grep -q '/src/main.tsx' dist/index.html; then
            echo "::error::dist/index.html punta al sorgente: il sito servirebbe una pagina bianca"
            exit 1
          fi
          grep -q 'assets/index-.*\.js' dist/index.html \
            || { echo "::error::dist/index.html non carica nessun bundle"; exit 1; }
          test -f dist/staticwebapp.config.json \
            || { echo "::error::staticwebapp.config.json non e' in dist: senza, i link diretti danno 404"; exit 1; }
          echo "dist/ e' pubblicabile"

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Formattazione
        run: terraform fmt -check -recursive

      - name: Validazione
        # Senza backend: qui non servono credenziali Azure, si controlla solo
        # che la configurazione sia coerente con lo schema dei provider.
        run: |
          terraform init -backend=false -input=false
          terraform validate

  scripts:
    name: Script di deploy (sintassi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash
        run: bash -n scripts/deploy.sh scripts/update-api.sh terraform/scripts/bootstrap-state.sh terraform/scripts/list-models.sh

      - name: PowerShell
        shell: pwsh
        run: |
          $failed = $false
          # Solo i nostri script: node_modules ne contiene di terze parti.
          Get-ChildItem -Recurse -Filter *.ps1 |
            Where-Object { $_.FullName -notmatch 'node_modules' } |
            ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::$($errors[0].Message)"
            } else {
              Write-Host "OK $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

  docker:
    name: Build dell'immagine API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (senza push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
